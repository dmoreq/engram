<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Container badge -->
  <rect width="280" height="64" rx="14" fill="#FFFFFF" />
  <rect x="0.5" y="0.5" width="279" height="63" rx="13.5" stroke="rgba(30,28,26,0.18)" />

  <!-- Citation-lock vertical anchors (refs) -->
  <path d="M17 24V40M32 32V48M47 24V40" stroke="#666059" stroke-width="1.6" stroke-dasharray="2.5 2" />

  <!-- Bottom plane: Persistent Memory Layer -->
  <path d="M17 40L32 48L47 40L32 32L17 40Z" fill="#9333EA" fill-opacity="0.12" stroke="#9333EA" stroke-width="2" stroke-linejoin="round" />
  <circle cx="32" cy="48" r="2.8" fill="#9333EA" />

  <!-- Top plane: AST Code Graph Layer -->
  <path d="M17 24L32 32L47 24L32 16L17 24Z" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="32" cy="16" r="2.6" fill="#0D9488" />
  <circle cx="17" cy="24" r="2.8" fill="#0D9488" />
  <circle cx="47" cy="24" r="2.8" fill="#0D9488" />
  <circle cx="32" cy="32" r="3" fill="#1E1C1A" />

  <!-- Wordmark -->
  <text x="66" y="39" fill="#1E1C1A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">engram</text>

  <!-- CLI pill -->
  <rect x="178" y="19" width="38" height="24" rx="6" fill="#EFECE4" stroke="rgba(30,28,26,0.18)" />
  <text x="197" y="35.5" text-anchor="middle" fill="#0D9488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">eg</text>

  <!-- Zero-token memory badge -->
  <rect x="224" y="21" width="42" height="20" rx="5" fill="#9333EA" fill-opacity="0.12" stroke="#9333EA" stroke-opacity="0.4" />
  <text x="245" y="34.5" text-anchor="middle" fill="#7C3AED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">0-tok</text>
</svg>
