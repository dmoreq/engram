  <circle cx="32" cy="48" r="2.8" fill="#A855F7" />

  <!-- Top plane: AST Code Graph Layer -->
  <path d="M17 24L32 32L47 24L32 16L17 24Z" fill="#2DD4BF" fill-opacity="0.18" stroke="#2DD4BF" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="32" cy="16" r="2.6" fill="#2DD4BF" />
  <circle cx="17" cy="24" r="2.8" fill="#2DD4BF" />
  <circle cx="47" cy="24" r="2.8" fill="#2DD4BF" />
  <circle cx="32" cy="32" r="3" fill="#F0F6FC" />

  <!-- Wordmark -->
  <text x="66" y="39" fill="#F0F6FC" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">engram</text>

  <!-- CLI pill -->
  <rect x="178" y="19" width="38" height="24" rx="6" fill="#161B22" stroke="#30363D" />
  <text x="197" y="35.5" text-anchor="middle" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">eg</text>

  <!-- Zero-token memory badge -->
